<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wordproc</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            border: 0;
            outline: none;
        }
        /* Loading indicator shown until WASM is ready */
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ccc;
            font-family: sans-serif;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Wordproc...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script>
        // Hide loading indicator once the WASM module is initialized
        if (typeof Module === 'undefined') var Module = {};
        Module.onRuntimeInitialized = function() {
            var el = document.getElementById('loading');
            if (el) el.style.display = 'none';
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
